<title>Broke Tax Storyboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;900&display=block">
<style>
  /* Layout: a production storyboard sheet; two-column grid of 16:9 key frames, notes under each. Single deliberate dark look matching the piece. */
  :root {
    --bg: #0d0f33; --panel: #17154a; --line: #2e2a6e; --fg: #eeeaff; --muted: #b3aade; --gold: #ffd23f; --cyan: #7ff0ff; --pink: #ff8fb8;
    --display: "Nunito", "Fredoka", system-ui, sans-serif; --body: "Nunito", system-ui, sans-serif;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 1240px; margin: 0 auto; padding-block: 32px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header.top { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; margin-bottom: 24px; }
  h1 { font-family: var(--display); font-weight: 900; font-size: clamp(26px, 4vw, 40px); line-height: 1.1; margin: 0; text-wrap: balance; }
  h1 em { color: var(--gold); font-style: normal; }
  .meta { color: var(--muted); font-weight: 700; letter-spacing: 0.04em; font-size: 13px; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 24px; }
  .beat { background: var(--panel); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .beat canvas { width: 100%; height: auto; aspect-ratio: 9 / 16; display: block; background: #090b2c; }
  .notes { padding: 14px 18px 18px; display: grid; gap: 8px; }
  .head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .num { font-family: var(--display); font-weight: 900; font-size: 22px; color: var(--gold); }
  .name { font-weight: 900; font-size: 17px; }
  .time { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--cyan); font-weight: 700; font-size: 13px; }
  dl { margin: 0; display: grid; grid-template-columns: 1fr; gap: 6px 12px; }
  dt { color: var(--muted); font-weight: 700; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; padding-top: 6px; }
  dd { margin: 0; min-width: 0; }
  dd q { quotes: none; font-weight: 900; color: #fff; }
  .tag { display: inline-block; font-size: 11px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 8px; border-radius: 99px; margin-right: 6px; background: var(--line); color: var(--cyan); }
  .tag.cut { color: var(--pink); }
  .assume { margin-top: 32px; background: var(--panel); border-radius: 18px; padding: 18px 22px; }
  .assume h2 { font-family: var(--display); font-size: 20px; margin: 0 0 8px; }
  .assume ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
  .assume b { color: var(--gold); }
  @media (max-width: 520px) { dl { grid-template-columns: 1fr; } dt { padding-top: 6px; } }
</style>

<div class="wrap">
  <header class="top">
    <h1 id="sbh"></h1>
    <div class="meta" id="sbm"></div>
  </header>
  <div class="grid" id="grid"></div>
  <section class="assume">
    <h2>Notes and assumptions</h2>
    <ul id="sbn"></ul>
  </section>
</div>

<script>
// Shared helpers + style registry for the style-frame explorations.
// Every style is a pure function of time: draw(ctx, W, H, t). Same t => same pixels.
(function () {
  const STYLES = (window.STYLES = window.STYLES || []);
  window.registerStyle = (s) => STYLES.push(s);

  const H = (window.H = {});

  // ---------- seeded randomness ----------
  // H.rng(seed) -> r() in [0,1). Extras: r.range(a,b), r.int(a,b), r.pick(arr), r.gauss(), r.chance(p)
  H.rng = function (seed = 1) {
    let a = typeof seed === 'string' ? hashStr(seed) : (seed >>> 0) || 1;
    const r = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + r() * (hi - lo);
    r.int = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return r;
  };
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  // ---------- gradient noise ----------
  // H.makeNoise(seed) -> { n2(x,y), n3(x,y,z), fbm2(x,y,oct), fbm3(x,y,z,oct) }  (outputs roughly -1..1)
  H.makeNoise = function (seed = 1) {
    const r = H.rng(seed), p = new Uint8Array(512), perm = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + (b - a) * t;
    const g3 = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
    function n3(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      return lerp(lerp(lerp(g3(p[AA], x, y, z), g3(p[BA], x - 1, y, z), u), lerp(g3(p[AB], x, y - 1, z), g3(p[BB], x - 1, y - 1, z), u), v),
        lerp(lerp(g3(p[AA + 1], x, y, z - 1), g3(p[BA + 1], x - 1, y, z - 1), u), lerp(g3(p[AB + 1], x, y - 1, z - 1), g3(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    }
    const n2 = (x, y) => n3(x, y, 0.5);
    const fbm3 = (x, y, z, oct = 4) => { let s = 0, a = 0.5, f = 1, norm = 0; for (let i = 0; i < oct; i++) { s += a * n3(x * f, y * f, z * f); norm += a; a *= 0.5; f *= 2; } return s / norm; };
    const fbm2 = (x, y, oct = 4) => fbm3(x, y, 0.5, oct);
    return { n2, n3, fbm2, fbm3 };
  };

  // ---------- math ----------
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  H.map = (v, a, b, c, d) => c + ((v - a) / (b - a)) * (d - c);
  H.smooth = (e0, e1, x) => { const t = H.clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  H.ease = {
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    out: (t) => 1 - Math.pow(1 - t, 3),
    in: (t) => t * t * t,
    back: (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  };

  // ---------- color ----------
  H.hex = (h) => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  H.rgba = (hexOrArr, a = 1) => { const [r, g, b] = Array.isArray(hexOrArr) ? hexOrArr : H.hex(hexOrArr); return `rgba(${r | 0},${g | 0},${b | 0},${a})`; };
  H.mix = (c1, c2, t) => { const a = Array.isArray(c1) ? c1 : H.hex(c1), b = Array.isArray(c2) ? c2 : H.hex(c2); return [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * t); };

  // ---------- canvas utilities ----------
  // Offscreen canvas of the same logical size (use for layers, masks, compositing).
  H.layer = (W, H_, ) => { const c = document.createElement('canvas'); c.width = W; c.height = H_; return c; };
  // Monochrome grain / film noise over the whole canvas. amount ~ 0.03-0.15
  H.grain = function (ctx, W, Hh, amount = 0.08, seed = 7, mono = true) {
    const img = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height), d = img.data, r = H.rng(seed), k = amount * 255;
    for (let i = 0; i < d.length; i += 4) {
      const n = (r() - 0.5) * k;
      if (mono) { d[i] += n; d[i + 1] += n; d[i + 2] += n; }
      else { d[i] += (r() - 0.5) * k; d[i + 1] += (r() - 0.5) * k; d[i + 2] += (r() - 0.5) * k; }
    }
    ctx.putImageData(img, 0, 0);
  };
  // Paper-ish texture tile: fills with base color + fibrous noise (cheap; drawn into ctx).
  H.paper = function (ctx, W, Hh, base = '#f3ecdc', seed = 3, strength = 0.06) {
    ctx.save(); ctx.fillStyle = base; ctx.fillRect(0, 0, W, Hh);
    const nz = H.makeNoise(seed), cell = 4, [br, bg, bb] = H.hex(base);
    for (let y = 0; y < Hh; y += cell) for (let x = 0; x < W; x += cell) {
      const v = nz.fbm2(x * 0.01, y * 0.01, 3) * 0.6 + nz.n2(x * 0.15, y * 0.04) * 0.4;
      const s = 1 + v * strength * 2;
      ctx.fillStyle = `rgb(${br * s | 0},${bg * s | 0},${bb * s | 0})`; ctx.fillRect(x, y, cell, cell);
    }
    ctx.restore();
  };
  // Vignette
  H.vignette = function (ctx, W, Hh, strength = 0.5, color = '0,0,0') {
    const g = ctx.createRadialGradient(W / 2, Hh / 2, Math.min(W, Hh) * 0.3, W / 2, Hh / 2, Math.hypot(W, Hh) * 0.6);
    g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},${strength})`);
    ctx.save(); ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh); ctx.restore();
  };

  // ---------- rendering entry ----------
  // Renders style into canvas at logical 1280x720 (canvas can be any pixel size; it is scaled).
  H.W = 1280; H.H = 720;
  H.loadFonts = async function (style) {
    const specs = style.fonts || [];
    try { const sample = 'AaZz09' + (window.FONT_SAMPLE || '');
      await Promise.all(specs.map((f) => document.fonts.load(f, sample))); await document.fonts.ready; } catch (e) { /* render anyway */ }
  };
  H.render = function (style, canvas, t) {
    const ctx = canvas.getContext('2d', { willReadFrequently: !!style.readsPixels });
    const sx = canvas.width / H.W, sy = canvas.height / H.H;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save(); ctx.scale(sx, sy);
    style.draw(ctx, H.W, H.H, t == null ? style.frameT || 0 : t);
    ctx.restore();
  };
})();

    head6a: 17.6, axes: [17.75, 18.2], head6b: 18.95, curves: [19.0, 20.9], hit: 20.9, compLbl: 21.1,
    head7: 21.85, ast: [21.95, 22.6], cone: [22.75, 23.3], noGuar: 23.35,

  };

  const DIVM = [2, 5]; // March and June
  const V = (yr) => 10000 * Math.pow(1.07, yr); // assumed: $10,000 at 7% a year, reinvested
  // stream coin spawns in the asset scene: [stream, spawnTime]
  const STREAM_SP = (() => { const a = []; for (let s = 0; s < 3; s++) for (let ts = 11.75 + s * 0.15; ts < 13.0; ts += 0.45) a.push([s, ts]); return a; })();

  // ================= ref helpers =================
  function rr(x, X, Y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r);

  function spark(x, cx, cy, r, col, a) {

  function crescent(x, cx, cy, r, dx, dy, fill) {

  function ball(x, cx, cy, r, col, o = {}) {
    if (r <= 0.3) return;

    const g = x.createLinearGradient(cx + lx * r, cy + ly * r, cx - lx * r, cy - ly * r);
    g.addColorStop(0, col[0]); g.addColorStop(0.45, col[1]); g.addColorStop(1, H.rgba(H.mix(col[1], col[2], 0.6)));

    if (o.inner) { x.save(); x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.clip(); o.inner(); x.restore(); }

    crescent(x, cx, cy, r, lx * r * sh * 2.2, ly * r * sh * 2.2, H.rgba(col[2], (o.sha == null ? 0.5 : o.sha) * 0.45));

  function arrow(x, P, prog, col, lw, o = {}) {

  // ================= SCENE 3: the hidden part -> in your head -> the trap -> the way out =================
  function s3(x, t) {

    // the broke person, with the cost inside their head
    const bIn = back(seg(t, 43.95, 44.35), 1.6), healed = eio(seg(t, 64.7, 65.6));

      x.save(); x.globalAlpha = 1 - healed; bean(x, 540, pY + Math.sin(t * 2) * 5, R, { t, ...cloneOpt, tired, sweat: tired ? 1 : 0, look: [0, -0.5], blink: blinkAt(t, 0.9), shock: t > 44.3 && t < 47.2 }); x.restore();
      if (healed > 0) { x.save(); x.globalAlpha = healed; bean(x, 540, pY + Math.sin(t * 2) * 5, R, { t, happy: 1, look: [0, -0.5], armUp: t > 70 ? 1 : 0 }); x.restore(); }
      // brain overlay on the head while we talk about stress

      battery(x, 860, 1090, 190, lerp(1, 0.12, eio(seg(t, 46.6, 49.7))) + 0.88 * eio(seg(t, 66.6, 69.0)) * (t > 66 ? 1 : 0) * 1, seg(t, 45.8, 46.1) * (1 - eio(seg(t, 56.6, 56.9))) + seg(t, 65.6, 65.9) * (1 - seg(t, 70.4, 70.7)), 'FOCUS');

    finish(x, PW, PH, t);
  }

    const soft = (t, g = 0.5) => k.play('pop', t, { f: 520, gain: 0.35 * g });

    k.play('thud', 0.0, { f: 110, gain: 0.35 }); k.play('swish', 0.0, { dur: 0.2, gain: 0.4 });

    k.play('tock', 12.15, { f: 420, gain: 0.3 }); k.play('sparkle', 12.3, { gain: 0.2, n: 3 });

    k.play('impact', 24.3, { gain: 0.3 });
    whoosh(26.6, 0.4, 0.35);
    k.play('paper', 27.5, { dur: 0.2, gain: 0.4 }); k.play('stamp', 27.6, { gain: 0.22 });
    k.play('paper', 29.82, { dur: 0.2, gain: 0.4 }); k.play('stamp', 29.92, { gain: 0.22 });

    whoosh(34.95, 0.4, 0.35);
    soft(35.45, 0.4); for (let i = 0; i < 6; i++) clink(36.6 + i * 0.25 + 0.75, 0.4, -0.3);
    pluck(37.06, 'E5', 0.4); pluck(37.13, 'B5', 0.35);

    k.noise(T.sweep[0] + 0.1, { dur: 0.7, color: 'brown', filter: 'lowpass', f: 260, gain: 0.2, a: 0.35 });
    soft(39.1, 0.45);
    k.play('riser', 40.8, { dur: 0.55, gain: 0.3 }); k.play('sparkle', 41.4, { gain: 0.3, n: 5 });
    k.play('stamp', 43.06, { gain: 0.2 });
    k.play('thud', 44.42, { f: 90, gain: 0.3 }); k.play('swish', 44.0, { dur: 0.25, gain: 0.3 });
    k.tone(46.6, { f: [[0, 520], [3.1, 160]], type: 'triangle', dur: 3.1, gain: 0.04, a: 0.2 });
    soft(49.1, 0.35); k.play('stamp', 49.7, { gain: 0.2 });
    for (let i = 0; i < 6; i++) clink(55.2 + i * 0.22, 0.3, (i - 2.5) * 0.15);
    // the trap
    whoosh(56.8, 0.4, 0.35);
    k.play('thud', 57.26, { f: 100, gain: 0.3 });

    // the way out
    k.play('impact', 64.72, { gain: 0.25 }); k.play('glitch', 64.75, { gain: 0.2 });
    k.play('pop', 65.05, { f: 420, gain: 0.3 }); k.play('sparkle', 65.1, { gain: 0.3, n: 5 });
    k.tone(66.6, { f: [[0, 220], [2.4, 660]], type: 'triangle', dur: 2.4, gain: 0.04, a: 0.2 });
    [68.46, 69.28, 70.18].forEach((ts, i) => pluck(ts + 0.02, ['C5', 'E5', 'G5'][i], 0.45));
    // into the mind
    k.play('riser', T.dive[0] - 0.1, { dur: 0.55, gain: 0.35 });
    k.play('impact', 74.92, { gain: 0.3 });
    ['C4', 'G4', 'C5', 'E5', 'G5'].forEach((n, i) => k.tone(74.94 + i * 0.012, { f: n, type: 'triangle', dur: 1.2, gain: 0.03, a: 0.02, verb: 0.3 }));
    k.play('sparkle', 75.0, { gain: 0.3, n: 6 });
  }

  window.FV = { explainer: explainerV, scoreSound: scoreSoundV, DURATION: DUR, W: PW, H: PH };
})();

  for (const f of ['900 64px "Nunito"', '700 28px "Nunito"', '600 32px "Fredoka"']) { try { await document.fonts.load(f, 'AaZz09$'); } catch (e) {} }
